name: Diag Compile (temp)

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
        with:
          build-scan-terms-of-use-url: "https://gradle.com/help/legal-terms-of-use"
          build-scan-terms-of-use-agree: "yes"
          build-scan-publish: false
          cache-read-only: true
      - run: chmod +x ./gradlew
      - name: Spotless apply
        continue-on-error: true
        run: |
          ./gradlew spotlessApply --no-daemon > apply-out.txt 2>&1
          echo "exit=$?" >> apply-out.txt
          git --no-pager diff --name-only > changed.txt
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -s changed.txt ]; then
            git add -A $(cat changed.txt)
            git commit -m "style: apply spotless formatting" || echo "nothing"
            git push origin HEAD:main
          else
            echo "no formatting changes"
          fi
      - name: Verify
        continue-on-error: true
        run: |
          ./gradlew spotlessCheck --no-daemon > verify.txt 2>&1
          grep -nE "BUILD SUCCESSFUL|BUILD FAILED" verify.txt | head -3
      - name: Commit verify
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f apply-out.txt changed.txt verify.txt
          git commit -m "chore: temp diagnostics output" || echo "nothing"
          git push origin HEAD:main
