name: Diag Compile (temp)

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
        with:
          build-scan-terms-of-use-url: "https://gradle.com/help/legal-terms-of-use"
          build-scan-terms-of-use-agree: "yes"
          build-scan-publish: false
          cache-read-only: true
      - run: chmod +x ./gradlew
      - name: Spotless check
        continue-on-error: true
        run: |
          ./gradlew spotlessCheck --no-daemon > spotless-out.txt 2>&1
          echo "exit=$?" >> spotless-out.txt
      - name: Grep result
        continue-on-error: true
        run: |
          {
            echo "=== violations ==="
            sed -n '/format violations/,/Run .\/gradlew spotlessApply/p' spotless-out.txt | head -60
            echo "=== build result ==="
            grep -nE "BUILD SUCCESSFUL|BUILD FAILED" spotless-out.txt
          } > spotless-errors.txt 2>&1
          cat spotless-errors.txt
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f spotless-out.txt spotless-errors.txt
          git commit -m "chore: temp spotless diagnostics" || echo "nothing"
          git push origin HEAD:main
