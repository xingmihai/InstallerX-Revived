name: Diag Compile (temp)

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
        with:
          build-scan-terms-of-use-url: "https://gradle.com/help/legal-terms-of-use"
          build-scan-terms-of-use-agree: "yes"
          build-scan-publish: false
          cache-read-only: true
      - run: chmod +x ./gradlew
      - name: Compile
        continue-on-error: true
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew compilePreviewReleaseKotlin --stacktrace --no-daemon > compile-out.txt 2>&1
          echo "exit=$?" >> compile-out.txt
      - name: Grep errors
        continue-on-error: true
        run: |
          {
            echo "=== e: lines ==="
            grep -n "^e: " compile-out.txt | head -60
            echo "=== What went wrong ==="
            sed -n '/What went wrong/,/^$/p' compile-out.txt | head -30
          } > errors.txt 2>&1
          cat errors.txt
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f compile-out.txt errors.txt
          git commit -m "chore: temp compile diagnostics" || echo "nothing"
          git push origin HEAD:main
