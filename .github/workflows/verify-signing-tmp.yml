name: Verify APK Signature (temp)

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '25'

      - name: Download built APK from draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download 26.10.signing-test --repo xingmihai/InstallerX-Revived -D dl
          ls -l dl

      - name: Verify signature
        run: |
          APK=$(ls dl/*.apk | head -1)
          {
            echo "APK: $APK"
            echo "SIZE: $(stat -c%s "$APK")"
            echo "=== apksigner verify ==="
            SIGNER=$(find /usr/local/lib/android/sdk/build-tools -name apksigner 2>/dev/null | sort -V | tail -1)
            if [ -n "$SIGNER" ]; then
              "$SIGNER" verify --print-certs -v "$APK" 2>&1 || true
            else
              echo "apksigner not found, fallback"
            fi
            echo "=== keytool -printcert -jarfile ==="
            keytool -printcert -jarfile "$APK" 2>&1 || true
            echo "=== META-INF entries ==="
            unzip -l "$APK" 2>/dev/null | grep -i "META-INF" || true
          } > verify-result.txt 2>&1
          cat verify-result.txt

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f verify-result.txt
          git commit -m "chore: temp signature verification result" || echo "nothing"
          git push origin HEAD:main
